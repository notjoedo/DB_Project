services:
  mysql:
    image: mysql:8.4
    container_name: treefinder-mysql
    environment:
      MYSQL_ROOT_PASSWORD: treefinder
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sqlproject/volunteer_db.sql:/docker-entrypoint-initdb.d/volunteer_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptreefinder"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
